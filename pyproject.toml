[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semverparse"
version = "0.1.0"
description = "A strict SemVer 2.0.0 parser and pretty printer with precise error locations."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kira-flint97" }]

[project.scripts]
semverparse = "semverparse.cli:main"

[tool.setuptools.packages.find]
include = ["semverparse*"]
